<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogo Parrilla — Gestão</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#12100e;--card:#1d1a17;--card2:#26221e;--line:#37312b;--tx:#efe9e2;--mut:#9c938a;--fire:#ff7a1a;--fire2:#ffb35c;--ok:#4cc27a;--bad:#e5544b;--blue:#5aa9e6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:linear-gradient(135deg,#1d1a17,#241d15);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:20px;letter-spacing:.5px}
header h1 span{color:var(--fire)}
.flame{font-size:26px}
#mes{margin-left:auto;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
nav{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:57px;z-index:19;overflow-x:auto}
nav button{background:none;border:none;color:var(--mut);font-size:14px;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--fire);border-color:var(--fire);font-weight:600}
main{padding:20px;max-width:1200px;margin:0 auto}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card .val{font-size:20px;font-weight:700}
.card .val.ok{color:var(--ok)}.card .val.bad{color:var(--bad)}.card .val.fire{color:var(--fire2)}
.charts{grid-template-columns:1fr;margin-top:14px}
@media(min-width:900px){.charts{grid-template-columns:2fr 1fr}}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;height:320px}
.chartbox h3{font-size:14px;color:var(--mut);margin-bottom:10px}
.chartbox canvas{max-height:260px}
h2{font-size:17px;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr:hover td{background:#242019}
.tw{overflow:auto;max-height:60vh;background:var(--card);border:1px solid var(--line);border-radius:12px}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
.btn{background:var(--fire);color:#1a1208;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.mini{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font-size:14px}
input:focus,select:focus{outline:1px solid var(--fire)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:640px;width:92vw}
dialog.wide{max-width:1040px;width:96vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:14px;color:var(--fire2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.dlgbar{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pill.c{background:#3d2a17;color:var(--fire2)}.pill.d{background:#1e3141;color:var(--blue)}
.pill.dia{background:#3a3117;color:#ffd66b}.pill.noite{background:#221a38;color:#b79df5}
.tot{font-weight:700;color:var(--fire2)}
.search{flex:1;min-width:160px}
.muted{color:var(--mut);font-size:12px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
body.light{--bg:#f5f1ea;--card:#ffffff;--card2:#efe9df;--line:#ddd4c7;--tx:#2b2115;--mut:#8a7d6d;--fire:#e05e00;--fire2:#b34a00;--ok:#1e8a4c;--bad:#c62f27;--blue:#1f6fb2}
body.light header{background:linear-gradient(135deg,#ffffff,#f7efe2)}
body.light .btn{color:#fff}
body.light tr:hover td{background:#f3ede2}
body.light .pill.dia{background:#f6e7bd;color:#7a5c00}
body.light .pill.noite{background:#e6ddfa;color:#5b3fa8}
body.light .pill.c{background:#fbe3c9;color:#9a4b00}
body.light .pill.d{background:#d9ecfb;color:#1f6fb2}
</style>
</head>
<body>
<header>
  <span class="flame">🔥</span>
  <h1>FOGO <span>PARRILLA</span> <span class="muted" style="font-weight:400">· gestão financeira · v3</span></h1>
  <select id="mes"></select>
  <button id="themeBtn" class="btn sec" title="Alternar tema" style="padding:7px 11px">☀️</button>
  <button id="lockBtn" class="btn sec" title="Bloquear tela" style="padding:7px 11px">🔒</button>
</header>
<nav id="nav">
  <button data-t="dash" class="on">📊 Dashboard</button>
  <button data-t="caixa">💰 Caixa Diário</button>
  <button data-t="compras">🛒 Compras</button>
  <button data-t="freel">👷 Freelancers</button>
  <button data-t="cantor">🎤 Cantores</button>
  <button data-t="assin">✍️ Notas Assinadas</button>
  <button data-t="diretoria">🏛️ Diretoria</button>
  <button data-t="nfs">📄 Notas Fiscais</button>
  <button data-t="relat">📑 Relatórios</button>
</nav>
<main id="main"></main>

<dialog id="dlg"></dialog>

<script id="seed" type="application/json">{"version": 2, "caixa": [], "compras": [], "freelancers": [], "cantores": [], "assinadas": [], "diretoria": [], "nfs": []}</script>
<script>
const fmt=v=>(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>{if(!d)return'—';const[y,m,dd]=String(d).split('-');return dd+'/'+m+'/'+(y||'').slice(2)};
const DOW=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const dow=d=>{if(!d)return'';const x=new Date(d+'T12:00:00');return isNaN(x)?'':DOW[x.getDay()]};
const KEY='fogoParrillaDB_v1';
let DB, tab='dash';

function load(){
  try{const s=localStorage.getItem(KEY); if(s){DB=JSON.parse(s);return}}catch(e){}
  DB=JSON.parse(document.getElementById('seed').textContent);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('Não foi possível salvar no navegador.')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
load();
['caixa','compras','freelancers','cantores','assinadas','diretoria','nfs'].forEach(k=>{(DB[k]||[]).forEach(x=>{if(!x.id)x.id=uid()})});

// ---- vínculo automático: compras/freelancers/assinadas alimentam o fechamento ----
const r2=v=>Math.round(v*100)/100;
function linked(c){
  const m=x=>x.data===c.data&&(x.turno||'DIA')===c.turno;
  return{
    cantor:(DB.cantores||[]).filter(x=>m(x)&&!x.pix).reduce((s,x)=>s+(+x.valor||0),0),
    free:DB.freelancers.filter(x=>m(x)&&!x.pix).reduce((s,x)=>s+(+x.valor||0),0),
    assin:DB.assinadas.filter(m).reduce((s,x)=>s+(+x.valor||0),0),
    custo:DB.compras.filter(x=>m(x)&&x.tipo==='Custo').reduce((s,x)=>s+(+x.valor||0),0),
    desp:DB.compras.filter(x=>m(x)&&x.tipo!=='Custo').reduce((s,x)=>s+(+x.valor||0),0)
  };
}
function eff(c){
  const l=linked(c);
  return{custo:r2((+c.custoMan||0)+l.custo),desp:r2((+c.despMan||0)+l.desp),
         free:r2((+c.freeMan||0)+l.free),assin:r2((+c.assinMan||0)+l.assin),
         cantor:r2((+c.cantorMan||0)+l.cantor),l};
}
// migração v2: valores antigos armazenados viram "ajuste avulso" (total preservado)
function migrate(){
  if(DB.version===2)return;
  DB.caixa.forEach(c=>{
    const l=linked(c);
    c.custoMan=r2((+c.custo||0)-l.custo); c.despMan=r2((+c.desp||0)-l.desp);
    c.freeMan=r2((+c.free||0)-l.free);   c.assinMan=r2((+c.assin||0)-l.assin);
    delete c.custo; delete c.desp; delete c.free; delete c.assin;
  });
  DB.version=2;
}
function normalize(){ // campo "táxi" passou a se chamar "retirada"
  (DB.caixa||[]).forEach(c=>{if(c.taxi!==undefined){if(c.retirada===undefined)c.retirada=c.taxi;delete c.taxi}});
}
migrate();normalize();save();

// ---- tema ----
const TKEY='fogoTheme';
function applyTheme(t){
  document.body.classList.toggle('light',t==='light');
  document.getElementById('themeBtn').textContent=t==='light'?'🌙':'☀️';
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
document.getElementById('themeBtn').onclick=()=>{
  applyTheme(document.body.classList.contains('light')?'dark':'light');render();
};
applyTheme((()=>{try{return localStorage.getItem(TKEY)||'dark'}catch(e){return 'dark'}})());
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();

// ---- month selector ----
function months(){
  const set=new Set();
  DB.caixa.forEach(c=>set.add(c.data.slice(0,7)));
  DB.nfs.forEach(c=>c.data&&set.add(c.data.slice(0,7)));
  const now=new Date().toISOString().slice(0,7); set.add(now);
  return[...set].sort().reverse();
}
let MES;
function drawMes(){
  const sel=document.getElementById('mes'); const ms=months();
  if(!MES||!ms.includes(MES))MES=ms[0];
  const NM=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  sel.innerHTML=ms.map(m=>`<option value="${m}" ${m===MES?'selected':''}>${NM[+m.slice(5,7)-1]}/${m.slice(0,4)}</option>`).join('');
  sel.onchange=()=>{MES=sel.value;render()};
}
const inMes=x=>x.data&&x.data.slice(0,7)===MES;

// ---- generic helpers ----
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
function del(list,id){if(!confirm('Excluir este lançamento?'))return;DB.tomb=DB.tomb||{};DB.tomb[id]=Date.now();DB[list]=DB[list].filter(x=>x.id!==id);save();render()}

// ---- dialog forms ----
function openForm(title,fields,onOk,init={}){
  const dlg=document.getElementById('dlg');
  dlg.classList.remove('wide');
  dlg.innerHTML=`<h3>${title}</h3><div class="fgrid">${fields.map(f=>{
    const v=init[f.k]??f.def??'';
    if(f.opts)return`<label>${f.l}<select id="f_${f.k}">${f.opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></label>`;
    return`<label>${f.l}<input id="f_${f.k}" type="${f.t||'text'}" step="0.01" value="${v}"></label>`;
  }).join('')}</div>
  <div class="dlgbar"><button class="btn sec" id="f_cancel">Cancelar</button><button class="btn" id="f_ok">Salvar</button></div>`;
  dlg.showModal();
  dlg.querySelector('#f_cancel').onclick=()=>dlg.close();
  dlg.querySelector('#f_ok').onclick=()=>{
    const o={};
    for(const f of fields){
      let v=dlg.querySelector('#f_'+f.k).value;
      if(f.t==='number')v=parseFloat(v)||0;
      o[f.k]=v;
    }
    if(fields.some(f=>f.req&&!o[f.k])){alert('Preencha os campos obrigatórios.');return}
    dlg.close(); onOk(o);
  };
}

// ================= DASHBOARD =================
function dash(){
  const cx=DB.caixa.filter(inMes);
  const fat=sum(cx,c=>c.fat+c.ifood+c.whats);
  const din=sum(cx,c=>c.din), cart=sum(cx,c=>c.cart), ifood=sum(cx,c=>c.ifood), whats=sum(cx,c=>c.whats);
  const saidas=sum(cx,c=>{const e=eff(c);return e.custo+e.desp+e.free+e.cantor+(+c.retirada||0)+(+c.moto||0)});
  const nfs=DB.nfs.filter(inMes);
  const nfTot=sum(nfs,n=>n.valor);
  const freeTot=r2(DB.freelancers.filter(inMes).reduce((s,f)=>s+freeTotal(f),0));
  const freePix=r2(DB.freelancers.filter(f=>inMes(f)&&f.pix).reduce((s,f)=>s+freeTotal(f),0));
  const cantTot=r2((DB.cantores||[]).filter(inMes).reduce((s,f)=>s+(+f.valor||0),0));
  const cantPix=r2((DB.cantores||[]).filter(f=>inMes(f)&&f.pix).reduce((s,f)=>s+(+f.valor||0),0));
  const assinTot=sum(DB.assinadas.filter(inMes),f=>f.valor);
  const dirTot=r2((DB.diretoria||[]).filter(inMes).reduce((s,f)=>s+(+f.valor||0),0));
  const gastos=r2(nfTot+saidas+freePix+cantPix+dirTot); // PIX não sai do caixa, mas é gasto
  const lucro=fat-gastos;
  const byT=t=>cx.filter(c=>c.turno===t);
  const fatDia=sum(byT('DIA'),c=>c.fat+c.ifood+c.whats), fatNoite=sum(byT('NOITE'),c=>c.fat+c.ifood+c.whats);
  const dias=[...new Set(cx.map(c=>c.data))].sort();
  const k=(l,v,cls='')=>`<div class="card"><div class="lbl">${l}</div><div class="val ${cls}">${typeof v==='number'?fmt(v):v}</div></div>`;
  document.getElementById('main').innerHTML=`
  <div class="grid kpis">
    ${k('Faturamento total',fat,'fire')}
    ${k('Dinheiro',din)}${k('PIX / Cartão',cart)}${k('iFood',ifood)}${k('WhatsApp',whats)}
    ${k('Faturamento DIA',fatDia)}${k('Faturamento NOITE',fatNoite)}
    ${k('Média por dia',dias.length?fat/dias.length:0)}
    ${k('Saídas de caixa',saidas,'bad')}
    ${k('Pagos via PIX',r2(freePix+cantPix),'bad')}
    ${k('Notas fiscais',nfTot,'bad')}
    ${k('Freelancers',freeTot)}
    ${k('Cantores',cantTot)}
    ${k('Diretoria',dirTot,'bad')}
    ${k('Notas assinadas',assinTot)}
    ${k('Gastos totais',gastos,'bad')}
    ${k('Resultado',lucro,lucro>=0?'ok':'bad')}
    ${k('Margem',fat?(lucro/fat*100).toFixed(1).replace('.',',')+'%':'—',lucro>=0?'ok':'bad')}
  </div>
  <div class="grid charts">
    <div class="chartbox"><h3>Faturamento diário — DIA × NOITE</h3><canvas id="ch1"></canvas></div>
    <div class="chartbox"><h3>Formas de recebimento</h3><canvas id="ch2"></canvas></div>
  </div>
  <div class="grid charts" style="grid-template-columns:1fr 1fr">
    <div class="chartbox"><h3>Canais de venda — Salão × iFood × WhatsApp</h3><canvas id="ch3"></canvas></div>
    <div class="chartbox"><h3>Canais por dia</h3><canvas id="ch4"></canvas></div>
  </div>`;
  const dd=dias.map(d=>byT('DIA').filter(c=>c.data===d).reduce((s,c)=>s+c.fat+c.ifood+c.whats,0));
  const dn=dias.map(d=>byT('NOITE').filter(c=>c.data===d).reduce((s,c)=>s+c.fat+c.ifood+c.whats,0));
  const MUT=css('--mut'),LN=css('--line');
  const gopt={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:MUT}}},scales:{x:{ticks:{color:MUT},grid:{color:LN},stacked:true},y:{ticks:{color:MUT},grid:{color:LN},stacked:true}}};
  new Chart(document.getElementById('ch1'),{type:'bar',data:{labels:dias.map(d=>d.slice(8)+' '+dow(d)),datasets:[
    {label:'DIA',data:dd,backgroundColor:'#ffb35c'},{label:'NOITE',data:dn,backgroundColor:'#7c5cd6'}]},options:gopt});
  const donut=(id,labels,data,cores)=>new Chart(document.getElementById(id),{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:cores,borderColor:css('--card')}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:MUT}},
      tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((s,v)=>s+v,0);
        return ` ${ctx.label}: ${fmt(ctx.parsed)} (${t?(ctx.parsed/t*100).toFixed(1).replace('.',','):0}%)`}}}}}});
  donut('ch2',['Cartão/PIX','Dinheiro'],[cart,din],['#ff7a1a','#4cc27a']);
  donut('ch3',['Salão','iFood','WhatsApp'],[r2(fat-ifood-whats),ifood,whats],['#ff7a1a','#e5544b','#5aa9e6']);
  const salaoD=dias.map(d=>r2(cx.filter(c=>c.data===d).reduce((s,c)=>s+(+c.fat||0),0)));
  const ifoodD=dias.map(d=>r2(cx.filter(c=>c.data===d).reduce((s,c)=>s+(+c.ifood||0),0)));
  const whatsD=dias.map(d=>r2(cx.filter(c=>c.data===d).reduce((s,c)=>s+(+c.whats||0),0)));
  new Chart(document.getElementById('ch4'),{type:'bar',data:{labels:dias.map(d=>d.slice(8)+' '+dow(d)),datasets:[
    {label:'Salão',data:salaoD,backgroundColor:'#ff7a1a'},
    {label:'iFood',data:ifoodD,backgroundColor:'#e5544b'},
    {label:'WhatsApp',data:whatsD,backgroundColor:'#5aa9e6'}]},options:gopt});
}

// ================= CAIXA =================
const CXF=[
  {k:'data',l:'Data *',t:'date',req:1},{k:'turno',l:'Turno',opts:['DIA','NOITE']},
  {k:'resp',l:'Responsável'},
  {k:'cxIni',l:'Caixa inicial',t:'number'},{k:'dinDel',l:'Dinheiro delivery',t:'number'},
  {k:'fat',l:'Faturamento (salão)',t:'number'},
  {k:'ifood',l:'iFood',t:'number'},{k:'whats',l:'WhatsApp',t:'number'},
  {k:'supr',l:'Suprimento',t:'number'},{k:'din',l:'Dinheiro',t:'number'},
  {k:'cart',l:'PIX/Cartão',t:'number'},{k:'assinMan',l:'Assinadas — ajuste avulso',t:'number'},
  {k:'custoMan',l:'Custo — ajuste avulso',t:'number'},{k:'despMan',l:'Despesa — ajuste avulso',t:'number'},
  {k:'freeMan',l:'Freelancer — ajuste avulso',t:'number'},{k:'cantorMan',l:'Cantor — ajuste avulso',t:'number'},{k:'retirada',l:'Retirada',t:'number'},
  {k:'moto',l:'Moto',t:'number'},{k:'cxFin',l:'Caixa final (contado)',t:'number'}];
// DIFERENÇA = caixa inicial + dinheiro + suprimento − saídas − notas assinadas − caixa final
function difCx(c){
  const e=eff(c);
  const sai=e.custo+e.desp+e.free+e.cantor+(+c.retirada||0)+(+c.moto||0);
  return r2(-((+c.cxIni||0)+(+c.dinDel||0)+(+c.din||0)+(+c.supr||0)-sai-e.assin-(+c.cxFin||0)));
}
// ---- relatório do turno (impressão + WhatsApp) ----
function caixaMovs(c){
  const m=x=>x.data===c.data&&(x.turno||'DIA')===c.turno;
  return{compras:DB.compras.filter(m),freel:DB.freelancers.filter(m),assin:DB.assinadas.filter(m),cant:(DB.cantores||[]).filter(m)};
}
function copyText(t,ok){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');alert(ok)}catch(e){alert('Não foi possível copiar.')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>alert(ok),fb);
  else fb();
}
function caixaTxt(c){
  const e=eff(c),mv=caixaMovs(c);
  const sai=r2(e.custo+e.desp+e.free+e.cantor+(+c.retirada||0)+(+c.moto||0));
  const L=[];
  L.push('*FOGO PARRILLA — FECHAMENTO DE CAIXA*');
  L.push(`📅 ${fmtD(c.data)} ${dow(c.data)} — turno ${c.turno}`);
  if(c.resp)L.push(`👤 Responsável: ${c.resp}`);
  L.push('','*RESUMO*');
  L.push(`Caixa inicial: ${fmt(c.cxIni)}`);
  if(+c.dinDel)L.push(`Dinheiro delivery: ${fmt(c.dinDel)}`);
  if(+c.supr)L.push(`Suprimento: ${fmt(c.supr)}`);
  if(isAdmin()){
    L.push(`Faturamento salão: ${fmt(c.fat)}`);
    if(+c.ifood)L.push(`iFood: ${fmt(c.ifood)}`);
    if(+c.whats)L.push(`WhatsApp: ${fmt(c.whats)}`);
    L.push(`Dinheiro: ${fmt(c.din)}`);
    L.push(`PIX/Cartão: ${fmt(c.cart)}`);
    if(e.assin)L.push(`Assinadas: ${fmt(e.assin)}`);
    L.push('',`*SAÍDAS: ${fmt(sai)}*`);
    if(e.custo)L.push(`Custo: ${fmt(e.custo)}`);
    if(e.desp)L.push(`Despesa: ${fmt(e.desp)}`);
    if(e.free)L.push(`Freelancer: ${fmt(e.free)}`);
    if(e.cantor)L.push(`Cantor: ${fmt(e.cantor)}`);
  }
  if(+c.retirada)L.push(`Retirada: ${fmt(c.retirada)}`);
  if(+c.moto)L.push(`Moto: ${fmt(c.moto)}`);
  L.push('',`*Caixa final: ${fmt(c.cxFin)}*`);
  if(isAdmin())L.push(`Diferença: ${fmt(difCx(c))}`);
  const mov=[];
  if(mv.compras.length)mov.push('🛒 Compras: '+mv.compras.map(x=>`${x.fornecedor} ${fmt(x.valor)}`).join(', '));
  if(mv.freel.length)mov.push('👷 Freelancers: '+mv.freel.map(x=>`${x.nome} ${fmt(freeTotal(x))}${x.pix?' (PIX)':''}`).join(', '));
  if(mv.cant.length)mov.push('🎤 Cantores: '+mv.cant.map(x=>`${x.nome} ${fmt(x.valor)}${x.pix?' (PIX)':''}`).join(', '));
  if(mv.assin.length)mov.push('✍️ Assinadas: '+mv.assin.map(x=>`${x.nome} ${fmt(x.valor)}`).join(', '));
  if(mov.length){L.push('','*MOVIMENTOS*');mov.forEach(x=>L.push(x))}
  return L.join('\n');
}

function wireEdit(list,fields,title){

function listView({title,list,fields,cols,groupBy,addTitle,editTitle,adminGroup}){
  const showGroup=!adminGroup||isAdmin();
  let rows=DB[list].filter(inMes).sort((a,b)=>a.data.localeCompare(b.data));
  const q=(window._q||'').toLowerCase();
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  const tot=sum(rows,r=>r.valor);
  const groups={};
  rows.forEach(r=>{const g=r[groupBy];groups[g]=(groups[g]||0)+r.valor});
  const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  document.getElementById('main').innerHTML=`
  <div class="bar"><h2 style="margin:0">${title}</h2><span class="muted">${rows.length} lançamentos · <span class="tot">${fmt(tot)}</span></span>
    <input class="search" placeholder="🔍 buscar..." id="q" value="${window._q||''}">
    <button class="btn" id="add">+ Novo</button></div>
  <div class="grid" style="grid-template-columns:${showGroup?'2fr 1fr':'1fr'};align-items:start">
    <div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}">${c.l}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.r?'r':''}">${c.f(r)}</td>`).join('')}
      <td><button class="btn mini sec" data-e="${r.id}">✎</button> ${isAdmin()?`<button class="btn mini danger" data-d="${r.id}">✕</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    ${showGroup?`<div class="card"><div class="lbl">Total por ${groupBy==='nome'?'pessoa':'fornecedor'}</div>
      <table>${top.map(([g,v])=>`<tr><td>${g}</td><td class="r tot">${fmt(v)}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
  document.getElementById('q').oninput=e=>{window._q=e.target.value;render();
    const el=document.getElementById('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
  document.getElementById('add').onclick=()=>openForm(addTitle||'Novo lançamento',fields,o=>{o.id=uid();o.mt=Date.now();DB[list].push(o);save();render()},{data:MES+'-01',turno:'DIA'});
  wireEdit(list,fields,editTitle||'Editar lançamento');
}

function freeTotal(f){
  if(f.itens&&f.itens.length)return r2(f.itens.reduce((s,i)=>s+(+i.valor||0)+(+i.heValor||0),0));
  return r2(+f.valor||0);
}

// ================= importador CSV (NF-e / NFS-e) =================
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(cur!==''||row.length){row.push(cur);rows.push(row);row=[];cur=''}}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const brNum=s=>{const v=parseFloat(String(s).trim().replace(/\./g,'').replace(',','.'));return isNaN(v)?0:v};
const brDate=s=>{const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:''};
function importNfCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2)return null;
  const hdr=rows[0].map(h=>h.toLowerCase());
  const idx=n=>hdr.findIndex(h=>h.includes(n));
  let map,tipoDef;
  if(idx('fornecedor')>=0&&idx('total')>=0){        // NF-e recebidas (produtos)
    map={nf:idx('mero'),forn:idx('fornecedor'),data:idx('emiss'),val:idx('total'),status:idx('status')};
    tipoDef='Custo';
  }else if(idx('prestador')>=0){                    // NFS-e recebidas (serviços)
    map={nf:Math.max(idx('mero'),0),forn:idx('prestador'),data:idx('emiss'),val:idx('valor'),status:-1};
    tipoDef='Despesa';
  }else return null;
  let add=0,dup=0,skip=0;const meses=new Set();
  for(const r of rows.slice(1)){
    if(r.length<3)continue;
    const st=map.status>=0?String(r[map.status]||''):'';
    if(st&&!/autorizad/i.test(st)){skip++;continue}
    const nf=String(r[map.nf]||'').trim(), forn=String(r[map.forn]||'').trim();
    const data=brDate(r[map.data]), valor=r2(brNum(r[map.val]));
    if(!forn||!valor){skip++;continue}
    if(DB.nfs.some(x=>String(x.nf)===nf&&Math.abs((+x.valor||0)-valor)<0.01)){dup++;if(data)meses.add(data.slice(0,7));continue}
    DB.nfs.push({id:uid(),mt:Date.now(),nf,fornecedor:forn,produtos:'',tipo:tipoDef,data,valor,categoria:'',obs:''});
    add++;if(data)meses.add(data.slice(0,7));
  }
  return{add,dup,skip,meses};
}
function readSmart(file){ // UTF-8, com fallback latin-1
  return file.text().then(t=>{
    if(!t.includes('�'))return t;
    return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsText(file,'iso-8859-1')});
  });
}
async function handleNfImport(files){
  let add=0,dup=0,skip=0,bad=[];const meses=new Set();
  for(const f of files){
    const r=importNfCSV(await readSmart(f));
    if(!r){bad.push(f.name);continue}
    add+=r.add;dup+=r.dup;skip+=r.skip;r.meses.forEach(m=>meses.add(m));
  }
  // pula para o mês das notas importadas
  const alvo=[...meses].sort().reverse()[0];
  if(alvo)MES=alvo;
  save();drawMes();render();
  const NM=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const nomeMes=m=>NM[+m.slice(5,7)-1]+'/'+m.slice(0,4);
  let msg=`Importação concluída:\n• ${add} nota(s) adicionada(s)`;
  if(dup)msg+=`\n• ${dup} ignorada(s) — já estavam lançadas`;
  if(skip)msg+=`\n• ${skip} ignorada(s) — canceladas/sem valor`;
  if(bad.length)msg+=`\n• Formato não reconhecido: ${bad.join(', ')}`;
  if(alvo)msg+=`\n\nNotas do período de ${nomeMes(alvo)} — a tela foi ajustada para esse mês.`;
  if(add)msg+='\nNF-e entram como Custo e NFS-e como Despesa — ajuste no ✎ se precisar.';
  alert(msg);
}

  let rows=DB.cantores.filter(inMes).sort((a,b)=>a.data.localeCompare(b.data));
  const q=(window._q||'').toLowerCase();
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  const tot=r2(rows.reduce((s,f)=>s+(+f.valor||0),0));
  const pix=r2(rows.filter(f=>f.pix).reduce((s,f)=>s+(+f.valor||0),0));
  const grupo={};rows.forEach(f=>grupo[f.nome]=r2((grupo[f.nome]||0)+(+f.valor||0)));
  const top=Object.entries(grupo).sort((a,b)=>b[1]-a[1]);
  document.getElementById('main').innerHTML=`
  <div class="bar"><h2 style="margin:0">🎤 Pagamentos a cantores</h2>
    <span class="muted">${rows.length} lançamento(s) · <span class="tot">${fmt(tot)}</span>${pix?' · sendo '+fmt(pix)+' em PIX (fora do caixa)':''}</span>
    <input class="search" id="q" placeholder="🔍 buscar..." value="${window._q||''}">
    <button class="btn" id="add">+ Novo pagamento</button></div>
  <div class="grid" style="grid-template-columns:${isAdmin()?'2fr 1fr':'1fr'};align-items:start">
    <div class="tw"><table><thead><tr><th>Data</th><th>Turno</th><th>Cantor / banda</th><th>Obs.</th><th>Pgto</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${rows.map(f=>`<tr><td>${fmtD(f.data)} <span class="muted">${dow(f.data)}</span></td>
      <td>${pillT(f)}</td><td>${f.nome}</td><td class="muted">${f.obs||''}</td>
      <td>${f.pix?'<span class="pill d">PIX</span>':'<span class="pill c">Dinheiro</span>'}</td>
      <td class="r tot">${fmt(f.valor)}</td>
      <td><button class="btn mini sec" data-p="${f.id}" title="Imprimir recibo">🖨</button>
          <button class="btn mini sec" data-e="${f.id}">✎</button>
          ${isAdmin()?`<button class="btn mini danger" data-d="${f.id}">✕</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    ${isAdmin()?`<div class="card"><div class="lbl">Total por cantor</div>
      <table>${top.map(([g,v])=>`<tr><td>${g}</td><td class="r tot">${fmt(v)}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
  document.getElementById('q').oninput=e=>{window._q=e.target.value;render();
    const el=document.getElementById('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
  const hoje=new Date().toISOString().slice(0,10);
  document.getElementById('add').onclick=()=>cantorForm('Novo pagamento a cantor',
    {data:hoje.slice(0,7)===MES?hoje:MES+'-01',turno:'NOITE'},
    (rec,print)=>{rec.id=uid();rec.mt=Date.now();DB.cantores.push(rec);save();render();if(print)printCantor(rec)});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const it=DB.cantores.find(x=>x.id===b.dataset.e);
    cantorForm('Editar pagamento',it,(rec,print)=>{Object.assign(it,rec);it.mt=Date.now();save();render();if(print)printCantor(it)})});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>printCantor(DB.cantores.find(x=>x.id===b.dataset.p)));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del('cantores',b.dataset.d));
}

// ================= DIRETORIA (despesas administrativas — sempre PIX) =================
const DIRCAT=['ALUGUEL','ÁGUA','LUZ','GÁS','INTERNET / TELEFONE','MANUTENÇÃO','IMPOSTOS','TAXAS',
  'CONTABILIDADE','MARKETING','SEGURO','SOFTWARE / SISTEMAS','SALÁRIOS','PRÓ-LABORE','EMPRÉSTIMO','INVESTIMENTOS','OUTROS'];
function dirForm(title,init,onOk){
  const dlg=document.getElementById('dlg');dlg.classList.remove('wide');
  const forns=[...new Set((DB.diretoria||[]).map(f=>f.fornecedor).filter(Boolean))].sort();
  dlg.innerHTML=`<datalist id="dirforn">${forns.map(n=>`<option value="${n}">`).join('')}</datalist>
  <h3>🏛️ ${title}</h3>
  <div class="fgrid">
    <label>Categoria *<select id="d_cat">${DIRCAT.map(c=>`<option ${init.categoria===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label>Descrição<input id="d_desc" value="${init.descricao||''}" placeholder="ex.: aluguel agosto"></label>
    <label>Fornecedor / favorecido<input id="d_forn" list="dirforn" value="${init.fornecedor||''}"></label>
    <label>Data do pagamento *<input type="date" id="d_data" value="${init.data||MES+'-01'}"></label>
    <label>Valor R$ *<input type="number" step="0.01" min="0" id="d_valor" value="${init.valor||''}"></label>
    <label>Tipo<select id="d_tipo">
      <option value="Custo" ${init.tipo!=='Despesa'&&init.tipo!=='Investimento'?'selected':''}>Custo</option>
      <option value="Despesa" ${init.tipo==='Despesa'?'selected':''}>Despesa</option>
      <option value="Investimento" ${init.tipo==='Investimento'?'selected':''}>Investimento</option></select></label>
    <label>Observação<input id="d_obs" value="${init.obs||''}"></label>
  </div>
  <p class="muted" style="margin-top:10px">Pagamentos da diretoria são sempre por PIX/transferência: entram nos gastos totais, mas não afetam o caixa do dia.</p>
  <div class="dlgbar">
    <button class="btn sec" id="d_cancel">Cancelar</button>
    <button class="btn" id="d_ok">Salvar</button>
  </div>`;
  dlg.showModal();
  dlg.querySelector('#d_cancel').onclick=()=>dlg.close();
  dlg.querySelector('#d_ok').onclick=()=>{
    const data=dlg.querySelector('#d_data').value;
    const valor=parseFloat(dlg.querySelector('#d_valor').value)||0;
    if(!data||!valor){alert('Preencha data e valor.');return}
    dlg.close();
    onOk({categoria:dlg.querySelector('#d_cat').value,descricao:dlg.querySelector('#d_desc').value.trim(),
      fornecedor:dlg.querySelector('#d_forn').value.trim(),data,valor:r2(valor),
      tipo:dlg.querySelector('#d_tipo').value,obs:dlg.querySelector('#d_obs').value.trim()});
  };
  setTimeout(()=>dlg.querySelector('#d_desc').focus(),60);
}
function diretoria(){
  DB.diretoria=DB.diretoria||[];
  let rows=DB.diretoria.filter(inMes).sort((a,b)=>b.data.localeCompare(a.data));
  const q=(window._q||'').toLowerCase();
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  const tot=r2(rows.reduce((s,f)=>s+(+f.valor||0),0));
  const grupo={};rows.forEach(f=>grupo[f.categoria]=r2((grupo[f.categoria]||0)+(+f.valor||0)));
  const top=Object.entries(grupo).sort((a,b)=>b[1]-a[1]);
  document.getElementById('main').innerHTML=`
  <div class="bar"><h2 style="margin:0">🏛️ Pagamentos da diretoria</h2>
    <span class="muted">${rows.length} lançamento(s) · <span class="tot">${fmt(tot)}</span></span>
    <input class="search" id="q" placeholder="🔍 categoria, fornecedor..." value="${window._q||''}">
    <button class="btn" id="add">+ Novo pagamento</button></div>
  <p class="muted" style="margin:0 0 10px">Aluguel, água, luz, impostos, manutenções, investimentos e afins. Pagos via PIX/transferência: somam nos gastos totais, sem afetar o caixa.</p>
  <div class="grid" style="grid-template-columns:2fr 1fr;align-items:start">
    <div class="tw"><table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Fornecedor</th><th>Tipo</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${rows.length?rows.map(f=>`<tr><td>${fmtD(f.data)}</td>
      <td><span class="pill c">${f.categoria||'—'}</span></td>
      <td>${f.descricao||'—'}${f.obs?` <span class="muted">(${f.obs})</span>`:''}</td>
      <td class="muted">${f.fornecedor||'—'}</td>
      <td><span class="pill ${f.tipo==='Custo'?'c':'d'}">${f.tipo||'Custo'}</span></td>
      <td class="r tot">${fmt(f.valor)}</td>
      <td><button class="btn mini sec" data-e="${f.id}">✎</button>
          <button class="btn mini danger" data-d="${f.id}">✕</button></td></tr>`).join('')
      :'<tr><td colspan="7" class="muted" style="padding:18px;text-align:center">Nenhum pagamento lançado neste mês.</td></tr>'}
    </tbody></table></div>
    <div class="card"><div class="lbl">Total por categoria</div>
      <table>${top.map(([g,v])=>`<tr><td>${g}</td><td class="r tot">${fmt(v)}</td></tr>`).join('')}
      ${top.length?`<tr><td><b>TOTAL</b></td><td class="r tot">${fmt(tot)}</td></tr>`:''}</table></div>
  </div>`;
  document.getElementById('q').oninput=e=>{window._q=e.target.value;render();
    const el=document.getElementById('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
  const hoje=new Date().toISOString().slice(0,10);
  document.getElementById('add').onclick=()=>dirForm('Novo pagamento da diretoria',
    {data:hoje.slice(0,7)===MES?hoje:MES+'-01',categoria:'ALUGUEL',tipo:'Custo'},
    rec=>{rec.id=uid();rec.mt=Date.now();DB.diretoria.push(rec);save();render()});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const it=DB.diretoria.find(x=>x.id===b.dataset.e);
    dirForm('Editar pagamento',it,rec=>{Object.assign(it,rec);it.mt=Date.now();save();render()})});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del('diretoria',b.dataset.d));
}

// ================= RELATÓRIOS =================
let RF=null;
function relat(){
  const ini=MES+'-01', fim=(()=>{const[y,m]=MES.split('-').map(Number);return MES+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')})();
  if(!RF)RF={tipo:'caixa',de:ini,ate:fim,turno:'',q:'',sub:''};
  const F=RF;
  const inRange=x=>x.data&&x.data>=F.de&&x.data<=F.ate&&(!F.turno||(x.turno||'DIA')===F.turno);
  const qq=(F.q||'').toLowerCase();
  const SUBS={caixa:[['','Todos os turnos']],
    cantores:[['','Todos'],['PIX','Somente PIX'],['DIN','Somente dinheiro']],
    diretoria:[['','Todas as categorias'],...DIRCAT.map(c=>[c,c])],
    freelancers:[['','Todos'],['DIARIA','Somente diárias'],['VT','Somente vale transporte'],['PIX','Somente PIX'],['DIN','Somente dinheiro']],
    compras:[['','Todos'],['Custo','Somente custo'],['Despesa','Somente despesa']],
    assinadas:[['','Todos']]};
  let rows=[],cols=[],total=0,grupo={},gLabel='';
  if(F.tipo==='caixa'){
    rows=DB.caixa.filter(inRange).filter(c=>!qq||JSON.stringify(c).toLowerCase().includes(qq))
      .sort((a,b)=>a.data.localeCompare(b.data)||(a.turno==='DIA'?-1:1));
    total=r2(rows.reduce((s,c)=>s+(+c.fat||0)+(+c.ifood||0)+(+c.whats||0),0));
    gLabel='Resumo do período';
  }else if(F.tipo==='freelancers'){
    rows=DB.freelancers.filter(inRange).filter(f=>{
      if(F.sub==='VT'&&!isVT(f))return false;
      if(F.sub==='DIARIA'&&isVT(f))return false;
      if(F.sub==='PIX'&&!f.pix)return false;
      if(F.sub==='DIN'&&f.pix)return false;
      return!qq||JSON.stringify(f).toLowerCase().includes(qq);
    }).sort((a,b)=>a.data.localeCompare(b.data));
    total=r2(rows.reduce((s,f)=>s+freeTotal(f),0));
    rows.forEach(f=>grupo[f.nome]=r2((grupo[f.nome]||0)+freeTotal(f)));gLabel='Total por pessoa';
  }else if(F.tipo==='cantores'){
    rows=(DB.cantores||[]).filter(inRange).filter(f=>{
      if(F.sub==='PIX'&&!f.pix)return false;
      if(F.sub==='DIN'&&f.pix)return false;
      return!qq||JSON.stringify(f).toLowerCase().includes(qq);
    }).sort((a,b)=>a.data.localeCompare(b.data));
    total=r2(rows.reduce((s,f)=>s+(+f.valor||0),0));
    rows.forEach(f=>grupo[f.nome]=r2((grupo[f.nome]||0)+(+f.valor||0)));gLabel='Total por cantor';
  }else if(F.tipo==='diretoria'){
    rows=(DB.diretoria||[]).filter(x=>x.data&&x.data>=F.de&&x.data<=F.ate)
      .filter(f=>(!F.sub||f.categoria===F.sub)&&(!qq||JSON.stringify(f).toLowerCase().includes(qq)))
      .sort((a,b)=>a.data.localeCompare(b.data));
    total=r2(rows.reduce((s,f)=>s+(+f.valor||0),0));
    rows.forEach(f=>grupo[f.categoria]=r2((grupo[f.categoria]||0)+(+f.valor||0)));gLabel='Total por categoria';
  }else if(F.tipo==='compras'){
    rows=DB.compras.filter(inRange).filter(c=>(!F.sub||c.tipo===F.sub)&&(!qq||JSON.stringify(c).toLowerCase().includes(qq)))
      .sort((a,b)=>a.data.localeCompare(b.data));
    total=r2(rows.reduce((s,c)=>s+(+c.valor||0),0));
    rows.forEach(c=>grupo[c.fornecedor]=r2((grupo[c.fornecedor]||0)+(+c.valor||0)));gLabel='Total por fornecedor';
  }else{
    rows=DB.assinadas.filter(inRange).filter(a=>!qq||JSON.stringify(a).toLowerCase().includes(qq))
      .sort((a,b)=>a.data.localeCompare(b.data));
    total=r2(rows.reduce((s,a)=>s+(+a.valor||0),0));
    rows.forEach(a=>grupo[a.nome]=r2((grupo[a.nome]||0)+(+a.valor||0)));gLabel='Total por pessoa';
  }
  const top=Object.entries(grupo).sort((a,b)=>b[1]-a[1]);
  // tabela
  let head='',body='';
  if(F.tipo==='caixa'){
    head=['Data','Turno','Resp.','Faturamento','Dinheiro','PIX/Cartão','Saídas','Cx final','Diferença'];
    body=rows.map(c=>{const e=eff(c),sai=r2(e.custo+e.desp+e.free+e.cantor+(+c.retirada||0)+(+c.moto||0));
      return[`${fmtD(c.data)} ${dow(c.data)}`,c.turno,c.resp||'—',
        fmt(r2((+c.fat||0)+(+c.ifood||0)+(+c.whats||0))),fmt(c.din),fmt(c.cart),fmt(sai),fmt(c.cxFin),
        `<span style="color:${difCx(c)<0?'var(--bad)':(difCx(c)>0?'var(--blue)':'var(--mut)')};font-weight:600">${fmt(difCx(c))}</span>`]});
  }else if(F.tipo==='freelancers'){
    head=['Pagamento','Turno','Nome','Tipo','Pgto','Dias','Valor'];
    body=rows.map(f=>{const its=freeItens(f);
      return[`${fmtD(f.data)} ${dow(f.data)}`,f.turno||'',f.nome,isVT(f)?'Vale transporte':'Diária',
        f.pix?'PIX':'Dinheiro',isVT(f)?'—':its.length,fmt(freeTotal(f))]});
  }else if(F.tipo==='cantores'){
    head=['Data','Turno','Cantor / banda','Obs.','Pgto','Valor'];
    body=rows.map(f=>[`${fmtD(f.data)} ${dow(f.data)}`,f.turno||'',f.nome,f.obs||'',f.pix?'PIX':'Dinheiro',fmt(f.valor)]);
  }else if(F.tipo==='diretoria'){
    head=['Data','Categoria','Descrição','Fornecedor','Tipo','Valor'];
    body=rows.map(f=>[fmtD(f.data),f.categoria||'',f.descricao||'',f.fornecedor||'',f.tipo||'Custo',fmt(f.valor)]);
  }else if(F.tipo==='compras'){
    head=['Data','Turno','Fornecedor','Tipo','Valor'];
    body=rows.map(c=>[`${fmtD(c.data)} ${dow(c.data)}`,c.turno||'',c.fornecedor,c.tipo,fmt(c.valor)]);
  }else{
    head=['Data','Turno','Nome','Valor'];
    body=rows.map(a=>[`${fmtD(a.data)} ${dow(a.data)}`,a.turno||'',a.nome,fmt(a.valor)]);
  }
  const NOME={caixa:'Fechamentos de caixa',freelancers:'Pagamentos de freelancers',cantores:'Pagamentos a cantores',diretoria:'Pagamentos da diretoria',compras:'Compras',assinadas:'Notas assinadas'};
  const extra=(()=>{
    if(F.tipo!=='caixa')return'';
    const s=k=>r2(rows.reduce((t,c)=>t+(+c[k]||0),0));
    const sai=r2(rows.reduce((t,c)=>{const e=eff(c);return t+e.custo+e.desp+e.free+e.cantor+(+c.retirada||0)+(+c.moto||0)},0));
    return`<div class="card"><div class="lbl">Resumo do período</div><table>
      <tr><td>Faturamento</td><td class="r tot">${fmt(total)}</td></tr>
      <tr><td>Dinheiro</td><td class="r">${fmt(s('din'))}</td></tr>
      <tr><td>Dinheiro delivery</td><td class="r">${fmt(s('dinDel'))}</td></tr>
      <tr><td>PIX/Cartão</td><td class="r">${fmt(s('cart'))}</td></tr>
      <tr><td>iFood</td><td class="r">${fmt(s('ifood'))}</td></tr>
      <tr><td>WhatsApp</td><td class="r">${fmt(s('whats'))}</td></tr>
      <tr><td>Saídas</td><td class="r neg">${fmt(sai)}</td></tr>
      <tr><td>Retiradas</td><td class="r">${fmt(s('retirada'))}</td></tr>
      <tr><td>Moto</td><td class="r">${fmt(s('moto'))}</td></tr>
      <tr><td>Diferenças</td><td class="r">${fmt(r2(rows.reduce((t,c)=>t+difCx(c),0)))}</td></tr>
    </table></div>`;
  })();
  document.getElementById('main').innerHTML=`
  <h2 style="margin-top:0">📑 Relatórios</h2>
  <div class="card" style="margin-bottom:14px">
    <div class="fgrid">
      <label>Relatório<select id="r_tipo">
        ${Object.entries(NOME).map(([k,v])=>`<option value="${k}" ${F.tipo===k?'selected':''}>${v}</option>`).join('')}
      </select></label>
      <label>De<input type="date" id="r_de" value="${F.de}"></label>
      <label>Até<input type="date" id="r_ate" value="${F.ate}"></label>
      <label>Turno<select id="r_turno">
        <option value="" ${!F.turno?'selected':''}>Todos</option>
        <option ${F.turno==='DIA'?'selected':''}>DIA</option>
        <option ${F.turno==='NOITE'?'selected':''}>NOITE</option></select></label>
      <label>Filtro<select id="r_sub">${(SUBS[F.tipo]||[['','Todos']]).map(([v,l])=>`<option value="${v}" ${F.sub===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label>Buscar<input id="r_q" placeholder="nome, fornecedor..." value="${F.q||''}"></label>
    </div>
    <div class="bar" style="margin:12px 0 0">
      <button class="btn sec mini" id="r_mes">Mês atual</button>
      <button class="btn sec mini" id="r_sem">Últimos 7 dias</button>
      <button class="btn sec mini" id="r_30">Últimos 30 dias</button>
      <span style="margin-left:auto"></span>
      <button class="btn sec" id="r_print">🖨 Imprimir</button>
      <button class="btn sec" id="r_wpp">📋 WhatsApp</button>
      <button class="btn sec" id="r_csv">⬇ CSV</button>
    </div>
  </div>
  <div class="bar"><b>${NOME[F.tipo]}</b>
    <span class="muted">${fmtD(F.de)} a ${fmtD(F.ate)} · ${rows.length} registro(s)</span>
    <span style="margin-left:auto" class="tot" style="font-size:18px">${F.tipo==='caixa'?'Faturamento: ':'Total: '}${fmt(total)}</span></div>
  <div class="grid" style="grid-template-columns:${top.length||F.tipo==='caixa'?'2fr 1fr':'1fr'};align-items:start">
    <div class="tw"><table><thead><tr>${head.map((h,i)=>`<th class="${i>=head.length-1?'r':''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${body.length?body.map(r=>`<tr>${r.map((v,i)=>`<td class="${i>=r.length-1?'r':''}">${v}</td>`).join('')}</tr>`).join(''):
      `<tr><td colspan="${head.length}" class="muted" style="padding:18px;text-align:center">Nenhum registro no período.</td></tr>`}</tbody></table></div>
    ${extra||(top.length?`<div class="card"><div class="lbl">${gLabel}</div><table>
      ${top.map(([g,v])=>`<tr><td>${g}</td><td class="r tot">${fmt(v)}</td></tr>`).join('')}
      <tr><td><b>TOTAL</b></td><td class="r tot">${fmt(total)}</td></tr></table></div>`:'')}
  </div>`;
  const upd=(k,v)=>{F[k]=v;if(k==='tipo')F.sub='';render()};
  document.getElementById('r_tipo').onchange=e=>upd('tipo',e.target.value);
  document.getElementById('r_de').onchange=e=>upd('de',e.target.value);
  document.getElementById('r_ate').onchange=e=>upd('ate',e.target.value);
  document.getElementById('r_turno').onchange=e=>upd('turno',e.target.value);
  document.getElementById('r_sub').onchange=e=>upd('sub',e.target.value);
  document.getElementById('r_q').oninput=e=>{F.q=e.target.value;render();
    const el=document.getElementById('r_q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
  const dm=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
  document.getElementById('r_mes').onclick=()=>{F.de=ini;F.ate=fim;render()};
  document.getElementById('r_sem').onclick=()=>{F.de=dm(6);F.ate=dm(0);render()};
  document.getElementById('r_30').onclick=()=>{F.de=dm(29);F.ate=dm(0);render()};
  const txt=()=>{
    const L=[`*FOGO PARRILLA — ${NOME[F.tipo].toUpperCase()}*`,`📅 ${fmtD(F.de)} a ${fmtD(F.ate)}${F.turno?' · turno '+F.turno:''}`,''];
    body.slice(0,60).forEach(r=>L.push('• '+r.map(v=>String(v).replace(/<[^>]*>/g,'')).join(' · ')));

// ================= importação de backup (mesclar/substituir) =================
function askImportMode(nd){
  const dlg=document.getElementById('dlg');dlg.classList.remove('wide');
  dlg.innerHTML=`<h3>⬆ Importar backup</h3>
  <p style="margin-bottom:14px">Como deseja importar os dados do arquivo?</p>
  <div class="dlgbar" style="justify-content:flex-start;flex-wrap:wrap">
    <button class="btn" id="im_merge">🔀 Mesclar (recomendado)</button>
    <button class="btn sec" id="im_replace">♻ Substituir tudo</button>
    <button class="btn sec" id="im_cancel">Cancelar</button></div>
  <p class="muted" style="margin-top:12px"><b>Mesclar:</b> mantém o que já está neste aparelho e adiciona apenas os lançamentos novos do arquivo (sem duplicar).<br>
  <b>Substituir:</b> apaga os dados deste aparelho e usa somente o que está no arquivo.</p>`;
  dlg.showModal();
  dlg.querySelector('#im_cancel').onclick=()=>dlg.close();
  dlg.querySelector('#im_replace').onclick=()=>{dlg.close();
    if(!confirm('Tem certeza? TODOS os dados deste aparelho serão substituídos pelos do arquivo.'))return;
    DB=nd;['caixa','compras','freelancers','cantores','assinadas','diretoria','nfs'].forEach(k=>{DB[k]=DB[k]||[];DB[k].forEach(x=>{if(!x.id)x.id=uid()})});
    migrate();normalize();save();drawMes();render();alert('Backup importado (substituição completa).')};
  dlg.querySelector('#im_merge').onclick=()=>{dlg.close();mergeDB(nd)};
}
function mergeDB(nd){
  const inc={caixa:nd.caixa||[],compras:nd.compras||[],freelancers:nd.freelancers||[],assinadas:nd.assinadas||[],nfs:nd.nfs||[]};
  if(nd.version!==2){ // converte arquivo antigo: valores do caixa viram ajuste avulso
    const lk=c=>{const m=x=>x.data===c.data&&(x.turno||'DIA')===c.turno;
      return{free:inc.freelancers.filter(m).reduce((s,x)=>s+(+x.valor||0),0),
             assin:inc.assinadas.filter(m).reduce((s,x)=>s+(+x.valor||0),0),
             custo:inc.compras.filter(x=>m(x)&&x.tipo==='Custo').reduce((s,x)=>s+(+x.valor||0),0),
             desp:inc.compras.filter(x=>m(x)&&x.tipo!=='Custo').reduce((s,x)=>s+(+x.valor||0),0)}};
    inc.caixa.forEach(c=>{if(c.custoMan!==undefined)return;const l=lk(c);
      c.custoMan=r2((+c.custo||0)-l.custo);c.despMan=r2((+c.desp||0)-l.desp);
      c.freeMan=r2((+c.free||0)-l.free);c.assinMan=r2((+c.assin||0)-l.assin);
      delete c.custo;delete c.desp;delete c.free;delete c.assin});
  }
  const key={
    caixa:x=>'c|'+x.data+'|'+(x.turno||''),
    compras:x=>['p',x.data,x.turno,x.fornecedor,(+x.valor||0).toFixed(2)].join('|'),
    freelancers:x=>['f',x.data,x.turno,x.nome,(+x.valor||0).toFixed(2)].join('|'),
    cantores:x=>['k',x.data,x.turno,x.nome,(+x.valor||0).toFixed(2)].join('|'),
    diretoria:x=>['d',x.data,x.categoria,x.descricao||'',(+x.valor||0).toFixed(2)].join('|'),
    assinadas:x=>['a',x.data,x.turno,x.nome,(+x.valor||0).toFixed(2)].join('|'),
    nfs:x=>['n',x.nf,(+x.valor||0).toFixed(2)].join('|')};
  let add=0,skip=0;
  for(const k in key){
    DB[k]=DB[k]||[];
    const have=new Set(DB[k].map(key[k]));
    for(const rec of inc[k]){
      const kk=key[k](rec);
      if(have.has(kk)){skip++;continue}
      rec.id=uid();rec.mt=rec.mt||Date.now();DB[k].push(rec);have.add(kk);add++;
    }
  }
  DB.version=2;normalize();save();drawMes();render();
  alert(`Mesclagem concluída:\n• ${add} lançamento(s) adicionado(s)\n• ${skip} já existiam neste aparelho e foram mantidos como estão`);
}

function contentKey(k,x){
  if(k==='caixa')return'c|'+x.data+'|'+(x.turno||'');
  if(k==='compras')return['p',x.data,x.turno,x.fornecedor,(+x.valor||0).toFixed(2)].join('|');
  if(k==='freelancers')return['f',x.data,x.turno,x.nome,(+x.valor||0).toFixed(2)].join('|');
  if(k==='assinadas')return['a',x.data,x.turno,x.nome,(+x.valor||0).toFixed(2)].join('|');
  return['n',x.nf,(+x.valor||0).toFixed(2)].join('|');
}
function mergeStates(a,b){ // une local (a) e nuvem (b); registro mais recente vence; exclusões respeitadas
  const out={version:2,tomb:Object.assign({},a.tomb||{},b.tomb||{})};
  ['caixa','compras','freelancers','cantores','assinadas','diretoria','nfs'].forEach(k=>{
    const map=new Map();
    [...(a[k]||[]),...(b[k]||[])].forEach(x=>{
      if(!x.id)x.id=uid();
      const p=map.get(x.id);
      if(!p||(+x.mt||0)>(+p.mt||0))map.set(x.id,x);
    });
    let arr=[...map.values()].filter(x=>{const dt=out.tomb[x.id];return!(dt&&dt>(+x.mt||0))});
    const byC=new Map(); // remove duplicados de conteúdo (ex.: backup importado em 2 aparelhos)
    arr.forEach(x=>{const ck=contentKey(k,x);const p=byC.get(ck);
      if(!p||(+x.mt||0)>(+p.mt||0))byC.set(ck,x)});
    out[k]=[...byC.values()];
  });
  return out;
}
async function syncNow(interactive){

  const u=await sessionUser();

  try{
    const before=JSON.stringify(DB);
    let{data:row,error}=await sb.from('app_shared').select('data').eq('id',SHARED_ID).maybeSingle();
    if(error)throw error;
    if(!row){ // primeira vez: aproveita os dados antigos da conta, se existirem
      try{const r0=await sb.from('app_state').select('data').eq('user_id',u.id).maybeSingle();
        if(r0&&r0.data&&r0.data.data)row={data:r0.data.data}}catch(e){}
    }
    if(row&&row.data)DB=mergeStates(DB,row.data);
    DB.version=2;normalize();_save();
    const{error:e2}=await sb.from('app_shared').upsert({id:SHARED_ID,data:DB,updated_at:new Date().toISOString()});
    if(e2)throw e2;
    syncStat('🟢 sincronizado','var(--ok)');
    if(JSON.stringify(DB)!==before&&!document.getElementById('dlg').open){drawMes();render()}
  }catch(e){syncStat('🔴 offline — salvo neste aparelho','var(--bad)')}
  finally{syncing=false}
}
